                exit 0=正常；exit 1/2/3=先按脚本提示补救（补齐专家/台账/登记），再进入路由。
                **编排器禁止直接调 `mcp__db2__*`**：任何 SQL 与库内核对都必须派发专家完成。主理人最多先查本地 `knowledge/corpus/docs/K1_表结构语料.md` 核表名/列名；**禁止凭印象编字段、禁止连库写 SELECT 试探表结构**。
                ## ⏩ 车道路由（v1.7 · 确定性优先）
                任何取数请求先跑确定性预检闸（规则 + jev 融合，落盘路由 JSON）：
                ```bash
                python $env:DSH_HOME\dwb-team/tools/gate_route.py --text "<用户原话>" --format text
                ```
                读输出 `lane / source / agreement / confidence / route_file`：`source=jev` 的降级仅在 `confidence≥0.85` 成立；jev 不可达（`jev_unreachable=true`）退回规则结论，禁止凭印象判型。路由结果已落盘 `observed/routes/<trace_id>.json`，供监衡与面板留痕。
                | 判型输出 | 走哪条 | SLA |
                |---|---|---|
                | `lane=fast` | **快车道**：`tools/fast_ask.py` → 物化 SQL → mcp_db2 → 出数 | ≤30s |
                | `lane=trend` | T2a 趋势快线（1 条区间 SQL） | ≤3min |
                | `lane=root_cause` / `lane=full` | 全流程：辨枢出 IntentContract → P0–P5 多专家 | L2/L3 |
                **快车道放行三硬条件**（缺一退回全流程）：
                ① 脚本判型 lane=fast；② fast_ask.py 返回 mode=materialized；③ ambiguous=false。
                禁止 LLM 覆盖脚本判型；禁止快车道内做 SUM 改写/区间聚合。
