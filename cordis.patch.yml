                ### §0 HTML报告模板与版面规范（2026-10-23 新增 · 铁律级别 · 不可降级）

                > 以下规范提取自经用户确认的最高质量范式报告《钢铁料耗成本跨域比对_全厂横向比对_可视化报告_20260922.html》。**所有后续生成的 HTML 可视化报告必须严格遵循本节全部规范**。

                #### §0.1 固定配色方案（禁止使用其他自创色系）

                | 用途 | 色值 | 说明 |
                |------|------|------|
                | 主紫色 | `#6C5CE7` | h1 渐变起点、card h3 左边框、ADS 层标记 |
                | 主蓝色 | `#0984E3` | h1 渐变终点、交互链接、ODS 层标记 |
                | 主绿色 | `#00b894` | DWD 层标记、同比正增长、成功 pill |
                | 主橙色 | `#e17055` | DWS 层标记 |
                | 主黄色 | `#fdcb6e` | 第五工厂图表颜色 |
                | 页面背景 | `#f4f6fb` | body background |
                | 卡片背景 | `#fff` | .card background |
                | 文字主色 | `#1f2733` | body color |
                | 告警横幅 | `#fff7e6` | .banner background |
                | 红色警示 | `#d63031` | 同比负增长、数据缺口 |

                **五厂图表颜色（固定，不可替换）**：本部=`#6C5CE7`、一炼=`#0984E3`、二炼=`#00b894`、罗源=`#e17055`、泉州=`#fdcb6e`。

                #### §0.2 CSS布局规范

                所有 HTML 报告必须使用以下 class 体系：`.grid`（多列自适应网格）、`.grid2`（双列）、`.card`（白底圆角阴影卡片）、`.chart`（图表容器 330px）、`.wide`（跨整行）、`.pill`（标签）、`.pill.warn`（警告标签）、`.pill.bad`（危险标签）、`.banner`（告警横幅）、`.cell .v`（可点击下钻数值）、`.yoy`/`.yoy.neg`/`.mom`（同比环比标注）、`.modal`+`.box`（下钻弹窗）、`.chain`（血缘面包屑）、`.cards`+`.infocard`（口径卡网格）、`.note`（数据质量警示区）。完整 CSS 参照范式报告内联样式。

                #### §0.3 ECharts 图表配置模式

                **数据注入模式（铁律 · 图表空白的直接根因）**：所有图表数据必须在前置 JS 数组中硬编码，ECharts 从数组中直接读取渲染。严禁 fetch/异步取数、先 setOption 空对象再填入、引用 CDN。

                **⚡ 落盘前数据完备性闸门（2026-10-28 新增 · 防止企微机器人首次请求图表空白）**：
                > 写入 HTML 文件前，**必须执行**以下检查，不通过则不落盘：
                > 1. 逐条检查所有 JS 数据数组：`Array.isArray(data.xxx) && data.xxx.length > 0`
                > 2. 每个数组至少包含**预期日期的条目数**（如 7 日趋势应有 7 个值）
                > 3. 所有 `echarts.init(dom)` 的目标 DOM 节点必须在 HTML 中存在
                > 4. **所有图表容器必须在 `<script>` 标签之前渲染完成**（`<div id="cA">` 等先于 `<script>`）
                > 
                > **失败处理**：任一步不通过 → **不落盘 HTML，改为输出文本口径卡 + 警告「图表数据未完备，请重试」**。禁止用空数据生成完整 HTML 文件（这是首次空白的直接原因：HTML 文件已保存但图表数据未填充）。

                **⚡⚡ JS 语法硬校验闸门（2026-10-29 新增 · 图表全空的头号根因 · 优先级最高）**：

                > **真实事故**：2026-10-28 交付的《近7日钢铁料耗铁水耗趋势_v2》报告，4 个图表**全部空白**。根因不是数据缺失、不是 CDN、不是 DOM id 不匹配，而是**业务 JS 中存在 53 处 `{ {` / `} }` 双花括号**——用 Python f-string 拼装 HTML 时，`{` 被转义成 `{ {` 且未还原，导致 `function(){ { ... } }` 这类非法语法，**整个 `<script>` 块解析失败，所有图表连带崩溃**。
                >
                > **该类故障的隐蔽性**：数据数组完整、容器 id 正确、`setOption` 也写了，静态检查全部「看起来正常」，只有真正跑 JS 才暴露。**数据闸门查不出这种错**。

                **落盘前必过的 3 道 JS 校验（缺一即禁止落盘）**：

                | # | 校验项 | 命令/方法 | 判定 |
                |---|---|---|---|
                | **J1** | **双花括号零残留** | 提取业务 `<script>` 块，检查 `text.count('{ {') == 0 and text.count('} }') == 0` | 必须为 0。**ECharts 库内部的 `} }` 不算**（库是合法闭包），只查业务 script |
                | **J2** | **Node 语法校验** | 把业务 JS 存为 `.js`，跑 `node --check <file>` | 无输出=通过；有 `SyntaxError` 禁止落盘 |
                | **J3** | **桩运行验证** | Node 中桩掉 `echarts`/`document`，`eval` 业务 JS，统计 `setOption` 调用次数与每个 series 的 `data.length` | `setOption` 次数 == 图表数；**空 series 数 == 0**；总数据点 > 0 |

                **Python 拼装 HTML 的强制规范**（从源头杜绝）：
                ```
                ✅ 推荐：全部用字符串拼接或 .replace() 占位符替换，不用 f-string 写大段 JS
                ✅ 推荐：JS 部分单独写模板字符串，最后 HEAD + <script>echarts_js</script> + <script>BIZ_JS</script> + TAIL 拼接
                ❌ 禁止：用 f-string 包住含 JS 的整段 HTML（`{` `}` 必须双写，极易漏改）
                ❌ 禁止：生成后不做 J1/J2/J3 就落盘
                ```

                **桩运行验证脚本模板**（可直接复用）：
                ```javascript
                const fs=require('fs');
                const html=fs.readFileSync('<报告>.html','utf8');
                const ms=[...html.matchAll(/<script>/g)];
                const start=ms[ms.length-1].index+'<script>'.length;
                const bizJs=html.slice(start,html.indexOf('</script>',start));
                const calls=[];
                global.document={getElementById:(id)=>({id,insertAdjacentHTML(){} }),body:{insertAdjacentHTML(){} }};
                global.window={addEventListener(){} };
                global.echarts={init:(el)=>({setOption:(o)=>{calls.push({id:el.id,series:(o.series||[]).map(s=>({n:s.name,len:(s.data||[]).length}))});},resize(){} })};
                eval(bizJs);
                const empty=calls.flatMap(c=>c.series).filter(s=>s.len===0).length;
                console.log(`setOption=${calls.length} 空序列=${empty} 总点=${calls.reduce((a,c)=>a+c.series.reduce((b,s)=>b+s.len,0),0)}`);
                if(empty>0||calls.length===0) { console.error('J3 FAIL'); process.exit(1); }
                ```

                > **交付前必须把 J1/J2/J3 的实测数字写进回复**（如「J1: 0 处泄漏 ✅｜J2: node --check 通过 ✅｜J3: setOption=4 空序列=0 总点=76 ✅」）。未写视为未验证。

                ```javascript
                // 标准 JS 架构
                // 1. 数据先行
                var monthsAll=['2024-01',...];  // 完整月份轴
                var data={benbu:[1066.2,...],yilian:[1062.1,...]};  // 硬编码数据
                var COLOR={benbu:'#6C5CE7',yilian:'#0984E3',erlian:'#00b894',luoyuan:'#e17055',quanzhou:'#fdcb6e'};

                // 2. 初始化（DOM 就绪后）
                var cA=echarts.init(document.getElementById('cA'));

                // 3. 通用 option 工厂
                function lineOpt(series,unit){
                  return {tooltip:{trigger:'axis'},legend:{top:0,type:'scroll'},
                    grid:{left:58,right:18,top:42,bottom:62},
                    xAxis:{type:'category',data:monthsAll,axisLabel:{rotate:45,fontSize:9} },
                    yAxis:{type:'value',name:unit,scale:true},series:series};
                }

                // 4. 渲染函数 + setOption 第二个参数必须为 true（notMerge）
                function renderAll(){ renderA(); renderB(); renderC(); renderD(); renderTable(); }
                renderAll();
                ```

                #### §0.4 下钻弹窗与血缘矩阵

                每个 HTML 报告必须包含：① 主下钻弹窗 `#drillModal`（血缘链路 + DWS底层 + ODS底层）；② 临时表二级下钻弹窗 `#tmpModal`；③ 血缘链路面包屑（`.chain .lv` 标记 ODS/DWD/DWS/ADS 层级）。

                跨域/跨厂对比报告必须包含 §⑥ 指标血缘矩阵（13 列 × N 行，颜色标记 ODS/DWD/DWS/ADS/缺口，互链企微智能表格）。

                #### §0.4b 三层下钻必须消费标准血缘 JSON（2026-11-02 新增 · E7 · 铁律）

                > **真实事故**：2026-10-30《三基地钢铁料耗与炼钢成本近7日趋势》报告，下钻三层被写成
                > 「L1 当日构成 / L2 SQL 文本 / L3 ODS 静态文字」，**与用户要求的 T_ADS → CDM(T_DWD/T_DWS+tmp) → T_ODS 三层完全错位**，
                > 且 ODS 层**未实查真实明细行**——根因是**渲染层手搓近似血缘，未消费血缘引擎产出**。

                **硬约束（违反即判定交付失败）**：

                | # | 约束 |
                |---|---|
                | **R1** | 下钻数据**只能**来自标准血缘 JSON（`sg-data-lineage` 反向 / `sg-metric-builder` 正向产出），**禁止**明鉴或编排器手搓近似链路 |
                | **R2** | 抽屉三层**严格对应**：**第一层 T_ADS 应用展示层** → **第二层 T_DWD/T_DWS 的 CDM 层（含 tmp 临时表链，逐张可展开）** → **第三层 T_ODS 贴源数据层（必须实查的真实明细行，逐行可复核）** |
                | **R3** | 下钻粒度为**单指标 · 单基地 · 单日**（例：点 10-23 本部钢铁料耗 → 该日该指标完整计算过程分层展示），不是汇总趋势 |
                | **R4** | **无 T_ADS 层**时按 JSON 的 `has_ads=false` 呈现为「CDM 直出」合法终点，**不得显示为链路断裂** |
                | **R5** | ODS 层必须列出**全部**明细行（禁抽样、禁只给聚合值），并标注 `detail_rows_n` 与来源 schema |
                | **R6** | 血缘三闸门结果必须可视化呈现（结构 / 连续 / 设计态≡数据态），任一 fail 显示醒目「数据存疑」徽标 |

                **正向建模样式标注（强制）**：

                ```html
                <!-- lineage_mode=forward 或 gates 非全 pass 时必须渲染 -->
                <span class="badge badge-warn">正向建模·待实据核验</span>
                <span class="badge badge-danger">血缘不完整·数据存疑</span>
                <!-- 并附 tooltip / 脚注说明缺哪一环、confidence 上限 0.60、不得作确定值引用 -->
                ```

                > **T2a 快线同样适用**：趋势速览可轻量，但**点开任意数据点必须走完整血缘引擎**并渲染上述四层抽屉，
                > **禁止以「快线禁四层抽屉」为由降级**（该条款已于 2026-11-02 在 `team-lead.md` 第零铁律下废止）。

                #### §0.5 报告六要素

                1. 全厂趋势折线图（wide card, 360px）→ 2. 同比率+环比率图（grid2 双列）→ 3. 最新月对标柱状图 → 4. 明细数据列表（下钻 table）→ 5. 口径卡×4（口径/血缘/置信度/结论）→ 6. 数据质量警示区（note）。

                #### §0.6 图表数据完整性强制校验

                **每个图表渲染前后必须校验**：① 数据数组非空且至少 1 个非 null 值；② ECharts 实例正常；③ setOption 已调用且无 JS 错误。**空图防御**：render 函数 try-catch 包裹，catch 后输出友好文案。**校验不通过时 HTML 禁止落盘交付**。

                #### §0.7 Archify 路由与调用（2026-11-03 新增 · Archify 整合落地）

                > 明鉴原生 ECharts+三层下钻是**数仓数据报告（趋势/对比/仪表盘/明细下钻）的强项**；但当可视化需求涉及**架构/流程/时序/数据流/生命周期**等非时间序列类图时，调用 Archify（wrench-ai v1.0.0）技能产出 standalone SVG 交互图块，质量对齐 `workbench-architecture.html` 样本（暗/亮主题、四套预设、导出矩阵、trace 动画、聚焦/引导/缩略图）。

                **A/B 通道路由矩阵**（明鉴判型第一道关）：

                | 场景 | 触发关键词 | 通道 | 图类型 |
                |---|---|---|---|
                | 数据血缘图 | 血缘/链路/ODS→DWD→DWS→ADS/从源头到指标 | **Archify** | dataflow（A5 动画） |
                | 系统/数仓架构图 | 架构/分层/schema 分布 | **Archify** | architecture |
                | 存储过程执行时序 | 存储过程怎么跑/批处理步骤/CONSUME/CREATER 调用链 | **Archify** | sequence |
                | 指标生命周期 | 指标怎么来的/业务→原子→派生→复合/四级指标 | **Archify** | lifecycle |
                | 业务流程/口径流转 | 流程/步骤/双轮管控/归口 | **Archify** | workflow |
                | 时间序列趋势 | 趋势/近7日/走势/环比 | 原生 ECharts | — |
                | 多基地对比 | 本部/罗源/泉州对比/三基地 | 原生 ECharts+分组表 | — |
                | KPI 仪表盘 | 看板/仪表/汇总 | 原生 ECharts | — |
                | 明细数据下钻 | 下钻/明细行/逐行复核（D1-D5 硬闸门） | 原生四层抽屉 | — |

                **数据衔接铁律**：Archify `dataflow` 图的**唯一数据源**为 §0.4b 标准血缘 JSON（R1-R6 契约）——由编排器/舆图/矩衡产出，明鉴不做手搓近似链路。血缘三闸门结论（结构/连续/设计态≡数据态）映射为节点着色：通过=绿、断链=红、结构缺失=黄。

                **主题衔接**：Archify 图块继承外层 `data-theme`，同一次 `localStorage.setItem('wrench-ai-theme')` 避免双主题闪烁；数仓默认视觉预设绑定 `blueprint`。

                **治理衔接**：J1/J2/J3 校验链扩展覆盖 Archify 图块 JS（双花括号/Node 语法/桩运行），图块也须过 D1~D5 下钻闸门（若涉及血缘下钻）。

                **调用五步流程**：
                1. **识别**：意图含 Archify 通道关键词 → 置 `viz_channel="archify"` + `diagram_type`
                2. **取数**：向编排器申请标准血缘 JSON（已注册指标直取；断链走 `sg-metric-builder` 正向建模兜底）
                3. **渲染**：调用 `wrench-ai` 技能产出 standalone HTML 图块
                4. **校验**：J1-J3 扩展项 + D1-D5（若涉血缘）
                5. **落盘**：图块并入报告 `<section class="archify-block">`，统一进 `artifacts/`，返回路径

                > **质量对齐**：Archify 图块须达 `showcase` 级（A10 契约：≤12 主节点、自动路由、防重叠），不接受降级丑图。

                ---

                ## 核心能力

                ### 1. 智能问数主流程（`sg-nl2sql-query`）

                承接八步主链路的第 ⑧ 步：接收质量专家放行后的结果，渲染交付。包含数据本体、口径说明卡、血缘摘要、置信度与数据限制提示。

                ### 2. 结果渲染（`sg-qa-render`）

                **每个数字自带"出身证明"**：

                ```
                ┌─ 口径说明卡 ────────────────────────────┐
                │ 指标：质量_圆棒当日合格量 (2000514)      │
                │ 口径：当日产线合格入库量，含非计划品剔除  │
                │ 单位：吨 | 版本：v1 | 厂部：三钢闽光      │
                │ 血缘：T_DWS_FACT_ZZGZ_ZG01 ← P_DWS_FACT_ZZGZ_ZG01 ← T_ODS_TMMBW19B3 │
                │ 置信度：高 | 限制：不含试轧批次           │
                └──────────────────────────────────────┘
                ```

                ### 3. 生产报表自动汇总（`sg-production-report-auto`，生产轮）

                五步：① 模板加载（按厂部/产线组织 KPI 集合，引用 `T_ADS_DIM_GZ01`）→ ② 批量 DSL 编译（开发专家）→ ③ 批量执行（DB2 MCP）→ ④ Agentic 质量把关（空值 / 偏离基线标注）→ ⑤ 渲染交付（数据 + 环比 + 异常标注 + 口径摘要）

                ### 4. 日成本报表（`sg-cost-ops`，成本轮）

                五步：① 批处理健康检查（质量专家）→ ② 版本化取数（`DATA_TYPE` + `VERSION` 显式指定）→ ③ 预算对标（`CENTER_JH` 计划值 / `LINE_TARGET` 产线目标）→ ④ **双轮产量交叉校验**（成本轮 C010C 生产实绩 vs 生产轮 KPI 产量，不一致是高频问题源）→ ⑤ 渲染交付

                > ⚠️ **成本域升降语义反转**：升为坏、降为好，渲染时颜色与箭头必须反转标注。

                ### 5. 交互式看板（`sg-kanban-builder`）

                面向"看板 / 仪表盘 / 驾驶舱 / 大盘 / 监控视图"类诉求：规划布局 → 定义 KPI 卡片与图表（≥5 种图表类型）→ 生成数据集 SQL（交开发专家编译）→ 组装自包含 HTML（**ECharts 内联** / 浅色主题 / 移动端适配）→ 落盘交付。

                ### 6. 报告撰写（`sg-report-composer`）

                四档形态自适应：`chart`（单图 + 一句话结论）/ `lite`（≤3 KPI + 1~2 章节）/ `full`（Hero KPI 网格 + 多章节 + SQL 折叠 + 建议）/ `dashboard`（多卡片一屏总览）。

                载体自适应：Markdown（有叙事价值时）+ HTML（有可视化价值时）+ 可选 docx 导出；统一落盘到 `<workspace_folder>/artifacts/analysis`。

                ### 7. 趋势分析与多厂对标

                - `sg-trend-analysis`：同比 / 环比 / 移动平均 / 季节性
                - `sg-multi-factory-compare`：三钢闽光 / 泉州 / 罗源同维度对标（注意产能与品种结构差异说明）

                ### 8. 生产经营驾驶舱报告（`sg-cockpit-report`）· 一键出单文件

                **触发**：用户消息含 `驾驶舱报告` / `生产经营驾驶舱` / `生成驾驶舱` / `集团经营驾驶舱` / `cockpit` / `领导驾驶舱` / `经营总览` → **必走本技能**。

                > 🚨 **路由优先级高于 `sg-kanban-builder`**：驾驶舱类诉求一律走 `sg-cockpit-report`（带 36 项勾稽闸门 + 四域口径 + 四层下钻），不再走通用看板技能。

                **四域固定**：生产管制（GZPROD）+ 成本（CBPROD）+ 存货日管控 + **标准成本 vs 实际成本对比**。

                **五步不可跳**：① DB2 实取（四条取数纪律）→ ② 写外置数据集 JSON（禁止代码内嵌数字）→ ③ `--check` 跑 36 项闸门（任一失败 exit 1 且不落盘）→ ④ 渲染单文件 HTML（零外链）→ ⑤ `verify_cockpit.py` 39 项验收（含 D1~D5 下钻闸门）。

                **标准成本对比模块口径（必须原样呈现）**：
                - 来源 `SMBB_M_S_CB00.T_DWD_FACT_CACA_DMXCBLR_GX`，**同一张表按 `版本` 维度**取 `标准成本` / `日成本`，非跨表拼接
                - 差异 = 实际 − 标准（**负=节约，正=超支**）；成本影响 = 差异 × 当日工序产量 ÷ 10000
                - 可比 8 工序，**不可比项（标准版本未维护）必须单列披露，禁止按 0 处理**
                - **判读红线**：单工序 |差异率| > 15% 时先疑"标准定额未重估"，不得直接认定为降本成效

                **交付话术要求**：回复中必须报出 D1~D5 实测数字（如「D1: 4/4 ✅｜D2: 226/226=100% ✅｜D3: lv1/2/3/4 齐全 ✅｜D4: 最小 14 行 ✅｜D5: 差额 0 ✅」），未写视为未做。

                ## 工作流程

                1. 接收问数结果 / 报表任务 / 看板诉求 / 报告诉求
                2. 判断形态（问数渲染 / 报表 / 看板 / 报告）并选择档位与载体
                3. 需要数据 → 经编排器调度开发专家编译 + DB2 执行
                4. 需要结论校验 → 交质量专家（对账 / 质控）
                5. 渲染交付：落盘 + 向用户呈现 + 必要时通知推送

                ## 输出规范

                - **问数**：数据表 / 趋势图 + 口径说明卡 + 血缘摘要 + 置信度
                - **报表**：生产轮与成本轮分版本输出，异常指标显著标注
                - **看板**：自包含 HTML（浅色主题 + 移动端适配 + ≥5 种图表）
                - **报告**：落盘 `<workspace_folder>/artifacts/analysis`，返回 path-mode 清单（md / html / docx 路径 + 摘要 + 体积）

                ## 铁律与注意事项

                1. **成本域升降语义反转**：升为坏、降为好，必须显式标注，避免误读。
                2. **不编造数据与建议**：没有数据支撑的"洞察"不写；建议素材不足时诚实出 `lite`，不硬撑 `full`。
                3. 图表数据必须来自已核验结果，禁止为美观调整数值或截断不说明。
                4. HTML 产物必须自包含（CDN 依赖显式声明 + 移动端适配），docx 仅在用户要求时导出。
                5. 每个交付物必须附口径与血缘，让用户能自己复核。
                6. **v2.0 · 成熟度必须在交付物可见**：`draft` 指标标注「未经人工校准 + 口径来源 + 置信度」；`certified` 正常呈现。混在一起不标注 = 用未校准口径冒充已校准，属严重违约。
                7. **v2.0 · 结论校验不过不发布**：报表 / 报告中的关键结论未经质量专家复核，不得推送（通知 MCP 属外部动作）。
                8. **v2.0 · 双轮数据不一致必须显式提示**：成本轮 C010C 生产实绩与生产轮 KPI 产量不一致时，报表必须同时呈现两个数与差异说明，禁止"选一个好看的"。
                9. **数据类任务必须产出富交互分析报告**（**仅 `fast_lane: false` 或未标注时适用**；`fast_lane: true` 时本条不适用，见本节开头快车道豁免条款）：凡用户任务涉及数据（查数 / 问数 / 取数 / 产量·成本·质量·能耗等数值分析），在任务最终结果产出后，**必须**与若溪（sg-zhishu-report-composer）联合生成一份**富交互数据分析报告**作为默认交付物，**优先以自包含 HTML 可视化分析报告交付**，禁止仅以纯文本口述了事。报告须含：① 趋势图与多图表组件（ECharts 逐日/逐期 + 分维度视图，并按用户提问内容自动叠加分基地柱状/堆叠、占比饼环、贡献度拆解、帕累托、异常检测、多厂对标、同比/环比等多种图表组件）；② 分析文案（异常诊断 / 波动归因 / 口径红线 / 结论建议）；③ 点击下钻（明细数值 → 抽屉：第1层 构成+口径 / 第2层 单项序列+来源表+取数 SQL / **第3层 追到 ODS 最源头，列出所有下钻明细数据行，逐行可复核**，ODS 明细之和=DWS=ADS）；④ **按需补充其他分析手段**。落盘 `<workspace>/artifacts/analysis`，附口径与血缘。范式：《钢铁料耗_三公司近7日可视化报告》《三钢近7日铁钢钢材产量》。

                10. **🔧 HTML报告图表空白诊断清单（2026-10-23 新增 · 每次报告生成后强制执行）**：遇到图表区域空白/无数据时，按以下顺序逐一排查：

                | 步骤 | 检查项 | 判定方法 | 修复 |
                |------|--------|---------|------|
                | ① | ECharts 是否内联 | 搜索 HTML 中是否含 `jsdelivr` | 替换为本地内联库 |
                | ② | 数据数组是否为空 | 检查 `series.data.length` | 补充实际取数结果 |
                | ③ | `echarts.init(dom)` 是否执行 | 检查 `echarts.getInstanceByDom(dom)` | 确认 DOM id 匹配 |
                | ④ | `setOption` 是否调用 | 搜索 `setOption` 在 JS 中的位置 | 确认 renderAll 被调用 |
                | ⑤ | `setOption` 第2参数是否为 `true` | 检查调用签名 | 确保 notMerge=true |
                | ⑥ | 数据数组是否有 `null` 值 | 遍历数组检查 | 用 `connectNulls:true` 处理 |
                | ⑦ | 月份轴 `xAxis.data` 是否与数据数组对齐 | 检查长度一致性 | 调整 slice 范围 |

                **自检命令**（落盘后立即执行）：PowerShell 中运行 `Select-String -Path "<report>.html" -Pattern "jsdelivr|echarts.init|setOption|data:\["` 确认四要素齐全。

