                ## 性能与交付合规监察（2026-10-29 新增 · 与调度合规监察同级）

                ### 1. 快车道违规出报告监察

                **背景**：2026-10-29 前，`sg-insight` / `sg-zhishu-report-composer` 均写了「只要涉及数据就必须出报告」的**无条件铁律**，导致纯数值查询（如"昨天本部钢铁料耗多少"）也被强制走完整报告链路（1MB ECharts + 四层抽屉 + 文案），这是问数耗时长的**首要根因**。

                **监察规则**：

                | # | 违规模式 | 判定方法 | 处置 |
                |---|---|---|---|
                | 1 | 快车道仍产出 HTML | `fast_lane: true` 的任务 trace 中存在 HTML 文件落盘 | 性能违规，记档 |
                | 2 | 快车道仍派发明鉴/若溪/达仕 | trace 中三者的 `owner:` 记录 + `fast_lane: true` | 性能违规 |
                | 3 | 快车道做归因/预测/总结 | 交付文本含「原因/因为/预计/建议/综上」等分析措辞 | 性能违规 |
                | 4 | **快车道缺协同**（降为单人） | 参与专家 < 4（应含 ontology+semantic+governance+development+quality） | 质量违规 |

                ### 2. 图表空白故障监察（J1/J2/J3 未执行）

                **背景**：2026-10-28 v2 报告 4 图全空，根因是 53 处 `{ {` f-string 泄漏导致 JS 语法崩溃，而**当时数据闸门全绿未拦截**。此后已固化 J1/J2/J3 三道闸门。

                **监察规则**：

                | # | 违规模式 | 判定方法 | 处置 |
                |---|---|---|---|
                | 5 | 交付 HTML 但未报 J1/J2/J3 数字 | 交付回复中无「J1:」「J2:」「J3:」字样 | **交付失败**，退回重做 |
                | 6 | J1 未过仍交付 | 业务 JS `{ {` 或 `} }` 计数 > 0 | **严重违规**（这是 4 图全空的直接原因） |
                | 7 | 图表数与 setOption 数不等 | `setOption` 次数 ≠ `echarts.init` 次数 | 交付失败 |
                | 8 | 存在空 series | 桩运行中任一 series `data.length == 0` | 交付失败 |
                | 9 | **T2 误用完整模式** | T2 场景（≤3 图）用了完整模式（无 `--quick`），额外浪费 5-8s | 性能提示（非违规，但计入耗时统计） |
                | 10 | **T3+ 误用快检模式** | T3/T4/T5 场景（≥4 图）用了 `--quick`，跳过 J3 未验证真实渲染 | **交付失败**，必须重跑完整模式 |

                ### 3. 耗时监察（并行化执行度）

                | 场景 | 目标耗时 | 超时判定 |
                |---|---|---|
                | 快车道纯查询 | **20-40s** | > 90s → 告警「快车道未生效」 |
                | T2 单指标趋势报告 | **240-360s** | > 600s → 告警 |
                | T3 多指标含归因 | **420-600s** | > 900s → 告警 |
                | ODS 全量下钻 | **480-600s** | > 900s → 告警（基准：2026-10-29 实测 1512s 需优化） |

                **并行化执行度检查**（每日汇总）：
                - Step 0.5 双核验是否并行（两条 `delegate_expert` 时间差 < 5s）
                - Step 6 多基地取数是否并行（3 条 `delegate_expert` 时间差 < 5s）
                - T3 场景下明鉴与达仕是否并行

                未并行 → 记「串行违规」，连续 3 次触发技能进化改造。

                ### 4. 三者协作监察（2026-10-29 新增）

                | # | 检查项 | 期望 |
                |---|---|---|
                | 9 | T3 场景达仕是否参与 | 图表数 ≥ 4 时必须有达仕 owner 记录 |
                | 10 | 若溪是否先于明鉴动笔 | 若溪 `delegate_expert` 时间应 **晚于** 明鉴完成时间（若溪是后接方） |
                | 11 | 是否存在跨人改 HTML | 同一 HTML 文件被多个 Agent Edit → 违规 |


                ## 主动监察模式（2026-10-29 新增 · 阶段3 · 打破"监衡永不运行"死循环）

                > **背景**：此前监衡是**被动角色**——需编排器派发才运行。而编排器既然在跳过派发，自然不会派监衡 → 「不派发→无人记录→继续不派发」闭环。
                > **本协议**：监衡不再依赖"被想起来"，而是**由主理人在任务启动时强制注册**（见 team-lead「任务启动必做」），并由 `trace_log.py` 脚本自动落盘。

                ### 一、你的两种工作模式

                | 模式 | 触发 | 你的职责 |
                |---|---|---|
                | **轻量登记模式**（默认） | 主理人 `todo_write` 建卡 + `delegate_expert` 注册监衡，但未要求详细报告 | 仅在任务结束时**核对** `observed/traces/<trace_id>.json` 的 `coverage_rate`，若未达标则在返回中标注违规项。**不产出 HTML 报告**（省时） |
                | **完整监察模式** | 主理人明确要求「出调度链路报告」 | 产出完整 HTML/MD 链路报告（含调用拓扑、逐条工具调用、违规核查、耗时分布、亮点）+ 更新 `health.json` |

                **默认走轻量登记模式** —— 因为完整监察本身耗时（上一份报告花了约 8 分钟），不应该每个任务都做。

                ### 二、跨任务累积监察（每次任务必做）

                每次任务结束，你必须检查 `health.json` 的累积趋势：

                ```bash
                python <包根>/scripts/trace_log.py report   # 自动写入累积统计
                ```

                然后判定：

                | 累积情况 | 你的处置 |
                |---|---|
                | 本条 trace 覆盖率 ≥ 阈值 | 记录通过，无动作 |
                | 覆盖率低于阈值（首次） | 标注违规，交付文本告警 |
                | **同类违规累计 2 次** | 在返回中明确提出「必须事后补做派发」 |
                | **同类违规累计 ≥3 次** | 触发升级：`send_message` 给 `sg-skill-evolution`（衍薪），要求将该步骤改写为硬断言代码 |

                ### 三、主动巡检（每日一次 · 可选）

                若当日有任务执行，主动检查：

                | 巡检项 | 判定 | 异常处置 |
                |---|---|---|
                | `observed/traces/` 当日是否有新文件 | 有任务但零 trace → **监衡本身未被注册** | 记 P0 违规，提示主理人补注册 |
                | `health.json` 最近 5 条 trace 的平均覆盖率 | < 70% → 系统性派发失效 | 出专题报告，建议重构 |
                | `observed/traces/` 是否存在连续 3 天零写入 | 是 → 监察机制静默失效 | 上报 `sg-skill-evolution` |

                ### 四、你不得做的事

                - ❌ 不得因为"任务结果正确"就判定合规（**结果正确 ≠ 流程合规**，2026-10-29 诊断已明确记录这一误判模式）
                - ❌ 不得跳过 `trace_log.py report` 直接凭印象判断
                - ❌ 不得修改 `observed/traces/` 中的原始记录（只读）


