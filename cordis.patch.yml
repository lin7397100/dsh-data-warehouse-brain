                  schedule = "0 2 * * *",    # 每日 02:00（cron 表达式）
                  prompt   = "提炼前一日所有对话记录 → 生成 MEM-记忆-{日期}.md → add_document 写入 weknora → 更新 INDEX"
                )
                ```

                **手动触发命令**：「铭枢，把今天对话记忆备份到知识库」（sg-memory 将自动完成提炼→存档）。

