                **三态授权**：explicit/inferred/not admitted；not admitted 不启动取数。
                **副作用先记录后执行**：派发/回执先在 trace ledger 登记再执行。
                ## 🚦 六道脚本闸门（v2.1 · 2026-11-20 · 不可跳过）
                > 权威源：`agents/references/intent_and_sql_gates.md`。闸门是**脚本**，退出码非 0 = 禁止进下一阶段，禁止用"经验判断"绕过。
                | # | 插入点 | 命令 | 卡死条件 |
                |---|---|---|---|
                | G1 | 判型后·取数前 | `tools/metric_disambiguate.py --text "<原话>"` | exit 3 必须请用户点名；exit 4 写入 open_questions |
                | G2 | 派发前 | `tools/intent_gate.py --contract observed/intents/<TR>.intent.json` | exit 1 退回辨枢重出契约 |
                | **G6** | **判定「数据对不对」之前** | **`tools/freshness_gate.py --probe knowledge/design/policy/probe_<TR>.json`** | **exit 1 缺埋点/时序倒挂；exit 6 跨源不可比** |
                | G3 | 执行前 | `tools/sql_static_check.py --sql artifacts/compiled/q_<TR>.sql` | exit 1 退回淬锋重编译 |
                | G4 | 进第三阶前 | `tools/sql_result_assert.py --result … --spec …` | exit 1 数据不可信禁止交付 |
                | G5 | 交付前 | `tools/sql_cross_source.py --spec …` | exit 1 DRIFT 阻断；exit 3/6 不得声称已核验 |
                **四条铁律**：
                1. **G6 三层埋点缺一不可**（`knowledge/kb/ETL抽数日志与存储过程日志_权威区分.md` 铁律级）：ETL 抽数日志 `SMBB_M_A_CS01.V_PUB_JOB_LOGS_LD_1D_X` + 过程日志 `<CREATER_SCHEMA>.T_PUB_JOB_LOGS` + 落表 `LOAD_TIME`。**过程日志答"跑成功了吗"，ETL 日志答"数据抽全了吗"，混用必漏。**
                2. **G6 若报「落表后 ODS 又抽数」→ 禁止把 DWS 与当前 ODS 的差异判成数据错**。ODS 是活数据（07:30 早会后反复重抽），DWS 是 07:35 快照，**时点不同，比出来的差异没有意义**。
                3. **G5 必须跨物理层**——「DWS 直取 vs `T_ADS_DIM_GZ01.SQL1`」是**同源镜像**（SQL1 源表就是 DWS），只证明写法等价；缺 ODS/ADS 层即判 `INSUFFICIENT`，**不得写"已对拍通过"**。
                4. **跨天/多轮任务必建工单**：`tools/ticket.py init --kind 5s-modeling …`，M1→…→MI **不可跳步**；用户说「继续」先 `ticket.py resume --thread <id>`。**改规则必 `tools/policy_check.py bump` + `notify`**，禁止静默改规则让在跑工单按新规则验收。
                **留痕**：G1~G6 退出码写进 `trace_log.py finish --artifact`（如 `G1=0 G2=0 G6=0 G3=0 G4=0 G5=VERIFIED`），监衡据此判定是否真跑过。
                ## 🔴 GATE-0 健康自检（每个任务第一步）
