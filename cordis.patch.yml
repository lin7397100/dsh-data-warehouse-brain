                GATE-0 的 `gate_route.py` 已用同一 `trace_id` 自动初始化台账 `observed/traces/<trace_id>.json`，无需手动 init；`trace_id` 取路由输出的 `trace_id`。若路由 JSON 中 `trace_init` 不为 `ok`，手动补 init 时**必须从路由 JSON 抄 `task_type`/`lane`**，禁止留默认值。
