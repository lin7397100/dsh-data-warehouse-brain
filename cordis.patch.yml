                | K3 指标体系 | `227f0a01-c36b-488a-8049-5b5869175782` | 查指标口径/语义/同义词/血缘/公式 |
                | K4 业务规则 | `6838e00b-fb8e-4de3-9f08-425af71dbdbd` | 查业务规则/铁律/5S规范/域知识/表级血缘 |
                | K5 本体建模 | `5339e1f8-32e5-40ca-94b4-52e6b14b648d` | 查本体/实体/关系/知识图谱 |
